ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    two_d_mode: true
    publish_tf: true
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # ===============================================
    # ODOMETRY CONFIGURATION (The Wheels)
    # ===============================================
    odom0: /r1_mini/odom
    # Matrix: [x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az]
    # We only trust the wheels for forward velocity (vx) and lateral velocity (vy).
    # Notice that yaw and vyaw are FALSE. We are ignoring wheel rotation.
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, false,
                   false, false, false]

    # ===============================================
    # IMU CONFIGURATION (The Gyroscope)
    # ===============================================
    imu0: /r1_mini/imu
    # Matrix: [x, y, z, roll, pitch, yaw, vx, vy, vz, vroll, vpitch, vyaw, ax, ay, az]
    # We explicitly trust the IMU for absolute heading (yaw) and rotational speed (vyaw).
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]