# ============================================================
#  Nav2 – Mapless Warehouse Navigation (Corrected)
#  Robot: r1_mini  |  ROS 2 Humble + Gazebo Harmonic
#  Key changes from default:
#    - No static map (true mapless via odom frame)
#    - DWB tuned for 0.3 m/s narrow-corridor operation
#    - Local costmap shrunk to 4 m rolling window
#    - Global costmap added as a 10 m rolling window
#    - Inflation radius matched to robot half-width + margin
#    - amcl disabled (odom-only localisation)
# ============================================================

# ── AMCL ────────────────────────────────────────────────────
amcl:
  ros__parameters:
    use_sim_time: True

# ── BT NAVIGATOR ────────────────────────────────────────────
bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: odom          # NO map frame – odom is root
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10        
    default_server_timeout: 25
    default_nav_to_pose_bt_xml: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_to_pose_w_replanning_and_recovery.xml"
    default_nav_through_poses_bt_xml: "/opt/ros/humble/share/nav2_bt_navigator/behavior_trees/navigate_through_poses_w_replanning_and_recovery.xml"
    
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_recovery_node_bt_node
      - nav2_distance_traveled_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_remove_passed_goals_action_bt_node

# ── PLANNER SERVER ──────────────────────────────────────────
planner_server:
  ros__parameters:
    use_sim_time: True
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

# ── CONTROLLER SERVER ───────────────────────────────────────
controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.01
    min_y_velocity_threshold: 0.01   # Diff-drive fix
    min_theta_velocity_threshold: 0.01
    failure_tolerance: 0.5
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.08
      movement_time_allowance: 12.0

    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.15

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: False
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.30
      max_vel_y: 0.0
      max_vel_theta: 0.9
      min_speed_xy: 0.0
      max_speed_xy: 0.30
      min_speed_theta: 0.0
      acc_lim_x: 2.5
      acc_lim_y: 0.0
      acc_lim_theta: 3.2
      decel_lim_x: -2.5
      decel_lim_y: 0.0
      decel_lim_theta: -3.2
      vx_samples: 15
      vy_samples: 1              # Diff-drive fix
      vtheta_samples: 30
      sim_time: 1.5              # Corridor cornering fix
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.15
      xy_goal_tolerance: 0.15
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: True
      stateful: True
      critics:
        ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign",
         "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 8.0
      PathAlign.forward_point_distance: 0.15
      GoalAlign.scale: 5.0
      GoalAlign.forward_point_distance: 0.15
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 28.0
      RotateToGoal.slowing_factor: 8.0
      RotateToGoal.lookahead_time: -1.0
      Oscillation.scale: 0.5

# ── LOCAL COSTMAP ───────────────────────────────────────────
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 4                     # Matched to 4m window
      height: 4
      resolution: 0.05
      robot_radius: 0.22
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /r1_mini/lidar
          sensor_frame: ""        
          data_type: "LaserScan"
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          raytrace_max_range: 3.5
          raytrace_min_range: 0.0
          obstacle_max_range: 3.0
          obstacle_min_range: 0.12
          clearing: True
          marking: True

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.32      # Bumped slightly to prevent wall clipping
        cost_scaling_factor: 8.0

      always_send_full_costmap: True

# ── GLOBAL COSTMAP ──────────────────────────────────────────
# Required for mapless Nav2 so it doesn't wait for a /map topic
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True
      global_frame: odom          # Odom is the global reference
      robot_base_frame: base_link
      update_frequency: 1.0
      publish_frequency: 1.0
      rolling_window: True        # Global map rolls with the robot
      width: 10
      height: 10
      resolution: 0.05
      robot_radius: 0.22
      plugins: ["obstacle_layer", "inflation_layer"]
      
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /r1_mini/lidar
          sensor_frame: ""
          data_type: "LaserScan"
          max_obstacle_height: 2.0
          min_obstacle_height: 0.0
          raytrace_max_range: 3.5
          raytrace_min_range: 0.0
          obstacle_max_range: 3.0
          obstacle_min_range: 0.12
          clearing: True
          marking: True
      
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.32
        cost_scaling_factor: 8.0
        
      always_send_full_costmap: True

# ── BEHAVIOUR SERVER ────────────────────────────────────────
# ── BEHAVIOUR SERVER ────────────────────────────────────────
behavior_server:
  ros__parameters:
    use_sim_time: True
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    # Change "back_up" to "backup" here:
    behavior_plugins: ["spin", "backup", "wait", "drive_on_heading"]
    spin:
      plugin: "nav2_behaviors/Spin"
    # And change the block name here:
    backup:
      plugin: "nav2_behaviors/BackUp"
    wait:
      plugin: "nav2_behaviors/Wait"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    global_frame: odom
    robot_base_frame: base_link
    transform_timeout: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.5      
    min_rotational_vel: 0.2      
    rotational_acc_lim: 2.0
# ── VELOCITY SMOOTHER ───────────────────────────────────────
velocity_smoother:
  ros__parameters:
    use_sim_time: True
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.30, 0.0, 0.80]
    min_velocity: [-0.15, 0.0, -0.80]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0